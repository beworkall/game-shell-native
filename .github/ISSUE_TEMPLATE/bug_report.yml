name: Bug report
description: Something crashes, freezes or looks wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the home screen, for example v0.5.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung S24 Ultra (SM-S928U1), Android 16
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Preset
      options: [Performance, Balanced, Quality, Custom]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Export log to Downloads, then attach GameShell-runtime.log (and a freeze report if there is one)
