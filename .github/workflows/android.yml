name: android-apk
# Push to main  -> builds the APK (download it from the run's Artifacts).
# Push a tag v* -> builds it AND publishes a GitHub Release with the APK attached.
# With the SIGNING_KEYSTORE_B64 + SIGNING_PASSWORD secrets set, the APK is a signed release build that
# installs as an update over the previous version. Without them it falls back to a debug build.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Rust and SDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build APK
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signed release build"
            ./make-android.sh release
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$ANDROID_HOME/build-tools/35.0.0"
            "$BT/zipalign" -P 16 -f 4 build/GameShellNative-unsigned.apk build/aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias shell \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out build/GameShellNative.apk build/aligned.apk
            "$BT/apksigner" verify --print-certs build/GameShellNative.apk
            rm -f "$RUNNER_TEMP/release.jks"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - building a debug APK (updates may need an uninstall)."
            ./make-android.sh
            cp build/GameShellNative-debug.apk build/GameShellNative.apk
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: game-shell-native-apk
          path: build/GameShellNative.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/GameShellNative.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Game Shell Native $GITHUB_REF_NAME" \
            --notes "Private build. Signed: $SIGNED. Contains no game files: point it at your own extracted game folder. See README.md for changes."
