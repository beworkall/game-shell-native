name: android-apk
# Push to main  -> builds the APK (Artifacts). If android/app/build.gradle has a new versionName, the signed APK is
#                  also published as a GitHub Release with tag v<version> and notes from CHANGELOG.md.
# Push a tag v* -> builds and publishes that release.
# With the SIGNING_KEYSTORE_B64 + SIGNING_PASSWORD secrets set, the APK is a signed release build that
# installs as an update over the previous version. Without them it falls back to a debug build.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Rust and SDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build APK
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signed release build"
            ./make-android.sh release
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$ANDROID_HOME/build-tools/35.0.0"
            "$BT/zipalign" -P 16 -f 4 build/GameShellNative-unsigned.apk build/aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias shell \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out build/GameShellNative.apk build/aligned.apk
            "$BT/apksigner" verify --print-certs build/GameShellNative.apk
            rm -f "$RUNNER_TEMP/release.jks"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - building a debug APK (updates may need an uninstall)."
            ./make-android.sh
            cp build/GameShellNative-debug.apk build/GameShellNative.apk
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: game-shell-native-apk
          path: build/GameShellNative.apk
      - name: Publish release
        # A release is published automatically the first time a new versionName (android/app/build.gradle)
        # reaches main with a signed build, or when a v* tag is pushed. Existing releases are never touched.
        if: env.SIGNED == 'yes' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VER=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          TAG="v${VER%%-*}"
          case "$GITHUB_REF" in refs/tags/v*) TAG="$GITHUB_REF_NAME" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to publish."; exit 0
          fi
          NOTES=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md)
          [ -n "$NOTES" ] || NOTES="See CHANGELOG.md."
          printf '%s\n\n---\n**Install:** download `GameShellNative.apk` below and open it on your phone. Signed: %s. Updates install over the previous version.\n\nContains no game files: point it at your own extracted game folder (see README).\n' "$NOTES" "$SIGNED" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" build/GameShellNative.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Game Shell Native $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
