name: android-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Rust and SDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: ./make-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: game-shell-native-apk
          path: build/gtav-mobile-debug.apk
