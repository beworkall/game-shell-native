plugins { id 'com.android.application' }
android {
    namespace 'com.alihammoud21.gtavmobile'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'app.webgameshell.nativeshell'
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName '0.5.2-shell7'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging false } }
}
tasks.register('buildRust', Exec) {
    workingDir '../..'
    commandLine './make-android.sh', '--native-only'
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }
